<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drill Library</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.classless.min.css">
    <link rel="stylesheet" href="drill.css">
</head>

<body>
  <header>
  <h1>Drill Library</h1>
  <nav>
    <button data-tab="drills-view" class="tab-btn active">Drills</button>
    <button data-tab="session-view" class="tab-btn">My Session <span id="session-count"></span></button>
  </nav>
</header>

<main>
  <section id="drills-view">
    <div class="filters">
      <input type="search" id="search" placeholder="Search drills..." aria-label="Search drills">
      <select id="skill-filter" aria-label="Skill">
        <option value="all">All skills</option>
      </select>
      <select id="difficulty-filter" aria-label="Difficulty">
        <option value="all">All levels</option>
        <option value="Beginner">Beginner</option>
        <option value="Intermediate">Intermediate</option>
        <option value="Advanced">Advanced</option>
      </select>
    </div>
    <nav>
      <button data-filter="all" class="filter-btn active">All</button>
      <button data-filter="individual" class="filter-btn">Individual</button>
      <button data-filter="group" class="filter-btn">Group</button>
    </nav>
    <div id="drill-grid"></div>
    <p id="no-results" hidden>No drills match your filters.</p>
  </section>

  <section id="session-view" hidden>
    <input type="text" id="session-name" placeholder="Session name (e.g. U12 Tuesday Practice)" aria-label="Session name">
    <p id="session-empty">No drills yet. Go to the Drills tab and click "Add to session".</p>
    <div id="session-list"></div>
    <p id="session-total"></p>
    <div class="session-actions">
      <button id="print-session">Print session</button>
      <button id="clear-session" class="secondary">Clear session</button>
    </div>
  </section>
</main>
<dialog id="drill-dialog">
  <article>
    <div id="drill-detail"></div>
    <button id="close-dialog">Close</button>
  </article>
</dialog>
<dialog id="confirm-dialog">
  <article>
    <h3>Clear this session?</h3>
    <p>This removes every drill from your session. You can't undo this.</p>
    <div class="confirm-buttons">
      <button id="confirm-cancel" class="secondary">Cancel</button>
      <button id="confirm-clear">Clear session</button>
    </div>
  </article>
</dialog>
    <script src="drill.js"></script>
</body>

</html>
